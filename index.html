<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Kertauspeli">
<meta name="theme-color" content="#f6e7c8">
<meta name="robots" content="noindex">
<title>Kertauspeli</title>
<style>
:root{--ink:#2b2118;--blue:#2f55a4;--blue2:#1e3c7a;--green:#2e9d5b;--red:#d2453b;--gold:#f2b705;--card:#fffaf0;--muted:#7a6a55;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;background:#f3dfb5;color:var(--ink)}
body{background:linear-gradient(#f9edd4,#efd7a6) fixed;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Rounded",system-ui,sans-serif;-webkit-tap-highlight-color:transparent;min-height:100vh;-webkit-text-size-adjust:100%}
#app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 28px)}
button{font:inherit;color:inherit;border:0;cursor:pointer;-webkit-user-select:none;user-select:none}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.chip{background:#ffffffaa;border-radius:999px;padding:6px 12px;font-weight:700;font-size:15px;white-space:nowrap}
.back{background:#ffffffaa;border-radius:999px;padding:8px 14px;font-weight:800}
h1{font-size:26px;margin:6px 0 2px;color:var(--blue2);line-height:1.15}
h2{font-size:22px;margin:6px 0 10px;color:var(--blue2)}
.sub{color:var(--muted);margin:0 0 10px;font-size:15px}
.path{display:flex;flex-direction:column;gap:12px;margin:8px 0 8px}
.node{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:20px;padding:12px 14px;box-shadow:0 3px 0 #d9bf8a;text-align:left;width:100%}
.node:nth-child(even){margin-left:26px;width:calc(100% - 26px)}
.node .ic{width:52px;height:52px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:26px;flex:none}
.node.full .ic{background:var(--gold)}
.node .nm{font-weight:800;font-size:16px;line-height:1.25}
.node .st{font-size:18px;letter-spacing:2px;color:#c58b00}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--card);border-radius:20px;padding:16px 10px;box-shadow:0 3px 0 #d9bf8a;text-align:center;font-weight:800;font-size:16px}
.tile .e{font-size:34px;display:block;margin-bottom:6px}
.tile small{display:block;font-weight:500;color:var(--muted);margin-top:4px;font-size:13px}
.tile.hot{background:#fff1d6;box-shadow:0 3px 0 #e0a43a}
.sec{font-weight:800;margin:22px 0 10px;font-size:18px}
.bar{height:12px;background:#ffffffaa;border-radius:99px;overflow:hidden;flex:1}
.bar i{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .3s}
.qcard{background:var(--card);border-radius:24px;padding:18px;box-shadow:0 4px 0 #d9bf8a;margin:12px 0 16px}
.tag{display:inline-block;background:#e3e9f7;color:var(--blue2);font-weight:800;font-size:13px;padding:4px 10px;border-radius:99px;margin-bottom:10px}
.tag.koe{background:#fde7c2;color:#8a5200}
.q{font-size:21px;font-weight:700;line-height:1.35}
.quote{font-style:italic;font-size:20px;line-height:1.4;border-left:5px solid var(--gold);padding-left:12px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{background:#fff;border-radius:16px;padding:15px 16px;font-size:17px;font-weight:600;text-align:left;box-shadow:0 3px 0 #d6c7a8;transition:transform .08s;line-height:1.3}
.opt:active{transform:translateY(2px)}
.opt.ok{background:var(--green);color:#fff;box-shadow:0 3px 0 #1d6b3d}
.opt.no{background:var(--red);color:#fff;box-shadow:0 3px 0 #8f2a23}
.opt.dim{opacity:.45}
.opts.row{flex-direction:row}.opts.row .opt{flex:1;text-align:center;font-size:19px}
.fb{margin-top:14px;border-radius:16px;padding:14px 16px;font-size:16px;line-height:1.4}
.fb.ok{background:#dff3e6}.fb.no{background:#fbe1de}
.big{display:block;width:100%;background:var(--blue);color:#fff;font-weight:800;font-size:18px;padding:16px;border-radius:18px;box-shadow:0 4px 0 var(--blue2);margin-top:14px}
.big.alt{background:#fff;color:var(--blue2);box-shadow:0 4px 0 #d6c7a8}
.spk{float:right;background:#e3e9f7;border-radius:50%;width:40px;height:40px;font-size:18px;margin:-4px -4px 6px 8px}
.shake{animation:sh .35s}
@keyframes sh{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.center{text-align:center}
.huge{font-size:64px;margin:10px 0 0}
.stars{font-size:46px;letter-spacing:6px;color:#e0a000}
.slot{border:2px dashed #c9ad77;border-radius:14px;padding:11px 12px;min-height:46px;color:var(--muted);font-size:15px;display:flex;gap:10px;align-items:center;margin-bottom:8px}
.slot b{flex:none;width:26px;height:26px;border-radius:50%;background:#e6d3ab;display:grid;place-items:center;font-size:14px;color:var(--ink)}
.slot.done{border-style:solid;border-color:var(--green);background:#dff3e6;color:var(--ink);font-weight:600}
.slot.done b{background:var(--green);color:#fff}
.match{display:grid;grid-template-columns:1fr 1.5fr;gap:10px;align-items:start}
.match .col{display:flex;flex-direction:column;gap:10px}
.mt{background:#fff;border-radius:14px;padding:12px;font-size:15px;font-weight:600;box-shadow:0 3px 0 #d6c7a8;text-align:left;min-height:54px;line-height:1.25}
.mt.term{font-weight:800;color:var(--blue2)}
.mt.sel{outline:3px solid var(--blue);outline-offset:-3px}
.mt.ok{background:#dff3e6;box-shadow:none;opacity:.55}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hc{background:var(--card);border-radius:18px;padding:14px;box-shadow:0 3px 0 #d9bf8a}
.hc .e{font-size:38px}
.hc b{display:block;font-size:17px;margin:4px 0}
.hc p{margin:4px 0;font-size:13.5px;line-height:1.35}
.hc.lock{opacity:.5;text-align:center;display:flex;flex-direction:column;justify-content:center;min-height:140px}
.clue{background:#fff;border-radius:14px;padding:12px 14px;margin-bottom:8px;font-size:17px;line-height:1.35}
.clue i{font-style:normal;font-weight:800;color:var(--blue2);margin-right:6px}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:9}
.confetti span{position:absolute;top:-40px;font-size:28px;animation:fall 2.4s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
table{width:100%;border-collapse:collapse;font-size:15px;background:var(--card);border-radius:14px;overflow:hidden}
td{padding:9px 8px;border-bottom:1px solid #eadbb9}
.small{font-size:14px;color:var(--muted);line-height:1.4}
.combo{color:#c45a00;font-weight:800}
.mlist{background:var(--card);border-radius:14px;padding:4px 12px}
.mlist div{padding:9px 0;border-bottom:1px solid #eadbb9;font-size:14.5px;line-height:1.35}
.mlist div:last-child{border:0}
</style>
</head>
<body>
<div id="app"></div>

<!-- ============ SISÄLTÖPAKETTI (vaihtuu koealueen mukaan) ============ -->

    { id:"k4", no:4, emoji:"⛺", title:"Abraham lähtee matkalle", cards:["Abraham"], q:[

      ["mc","Mitä paimentolaiset tekivät eläinten nahasta, villasta ja luista?","Vaatteita, peitteitä ja telttakankaita",["Leipää","Kolikoita","Laivoja"],"Eläimistä saatiin ruokaa, maitoa ja tarvikkeita."],

<!-- ============ PELIMOOTTORI (sama kaikille aineille) ============ -->
<script>
(function(){
const KEY = 'kp_' + PACK.id;
const defS = () => ({stars:{}, best:{}, miss:{}, cards:{}, games:{}, streak:{n:0,last:''}, xp:0});
let S;
try { S = Object.assign(defS(), JSON.parse(localStorage.getItem(KEY) || '{}')); } catch(e) { S = defS(); }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} };

const app = document.getElementById('app');
const $ = s => app.querySelector(s);
const $$ = s => Array.from(app.querySelectorAll(s));
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.random()*(i+1)|0; [a[i],a[j]]=[a[j],a[i]]; } return a; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const starStr = n => '★'.repeat(n) + '☆'.repeat(3-n);
const pick = a => a[Math.random()*a.length|0];
const PRAISE = ['Hienoa!','Mahtavaa!','Oikein!','Loistavaa!','Juuri niin!','Huippua!'];
const TRY = ['Melkein!','Ei haittaa!','Ensi kerralla!','Hyvä yritys!'];

// Kysymykset objekteiksi
const QS = [];
PACK.chapters.forEach(ch => ch.q.forEach((r,i) => {
  const id = ch.id + '-' + i;
  if (r[0] === 'tf') QS.push({id, ch:ch.id, type:'tf', text:r[1], answer: r[2] ? 'Totta' : 'Tarua', options:['Totta','Tarua'], explain:r[3]||''});
  else QS.push({id, ch:ch.id, type:r[0], text:r[1], answer:r[2], wrong:r[3], explain:r[4]||''});
}));
const qById = id => QS.find(q => q.id === id);

// Ääni & puhe
let AC;
function beep(ok){
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain(); o.connect(g); g.connect(AC.destination);
    const t = AC.currentTime; o.type = 'triangle';
    if (ok) { o.frequency.setValueAtTime(660,t); o.frequency.setValueAtTime(990,t+.09); }
    else { o.frequency.setValueAtTime(240,t); o.frequency.setValueAtTime(170,t+.12); }
    g.gain.setValueAtTime(.14,t); g.gain.exponentialRampToValueAtTime(.001,t+.32); o.start(t); o.stop(t+.33);
  } catch(e){}
}
function say(t){
  try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang='fi-FI'; u.rate=.95;
    const v = speechSynthesis.getVoices().find(v => v.lang && v.lang.toLowerCase().startsWith('fi')); if (v) u.voice = v;
    speechSynthesis.speak(u); } catch(e){}
}
app.addEventListener('click', e => { const b = e.target.closest('[data-say]'); if (b) say(b.dataset.say); });

function confetti(){
  const d = document.createElement('div'); d.className = 'confetti';
  const em = ['⭐','🎉','✨','🌟','🐫','🌾'];
  for (let i=0;i<34;i++){ const s=document.createElement('span'); s.textContent=pick(em); s.style.left=(Math.random()*100)+'%'; s.style.animationDelay=(Math.random()*.8)+'s'; d.appendChild(s); }
  document.body.appendChild(d); setTimeout(() => d.remove(), 3400);
}
function shake(el){ el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }
function dayStr(d){ return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
function touchDay(){
  const today = dayStr(new Date()), y = new Date(); y.setDate(y.getDate()-1);
  if (S.streak.last === today) return;
  S.streak.n = (S.streak.last === dayStr(y)) ? S.streak.n + 1 : 1;
  S.streak.last = today;
}
function go(fn){ window.scrollTo(0,0); fn(); }

// ---------- KOTI ----------
function home(){
  const tot = PACK.chapters.reduce((s,c) => s + (S.stars[c.id]||0), 0);
  const missN = Object.keys(S.miss).filter(qById).length;
  const nc = Object.keys(S.cards).length;
  app.innerHTML = `
    <div class="top"><span class="chip">⭐ ${tot}/${PACK.chapters.length*3}</span><span class="chip">🔥 ${S.streak.n} pv</span><span class="chip">💎 ${S.xp}</span></div>
    <h1>${esc(PACK.title)}</h1><p class="sub">${esc(PACK.subtitle)}</p>
    <div class="sec">🗺️ Seikkailupolku</div>
    <div class="path">${PACK.chapters.map(c => `
      <button class="node ${(S.stars[c.id]||0)===3?'full':''}" data-ch="${c.id}"><span class="ic">${c.emoji}</span>
      <span><span class="nm">${c.no}. ${esc(c.title)}</span><br><span class="st">${starStr(S.stars[c.id]||0)}</span></span></button>`).join('')}
    </div>
    <div class="sec">🎮 Pelit</div>
    <div class="grid">
      ${missN ? `<button class="tile hot" data-g="miss"><span class="e">🎯</span>Kertaa virheet<small>${missN} kysymystä</small></button>` : ''}
      <button class="tile" data-g="timeline"><span class="e">📜</span>Aikajana<small>Mikä tapahtui ensin?</small></button>
      <button class="tile" data-g="whoami"><span class="e">🕵️</span>Kuka minä olen?<small>Arvaa vihjeistä</small></button>
      <button class="tile" data-g="match"><span class="e">🧩</span>Sanaparit<small>Mitä sana tarkoittaa?</small></button>
      <button class="tile" data-g="exam"><span class="e">📝</span>Harjoituskoe<small>Kaikki kappaleet</small></button>
      <button class="tile" data-g="cards"><span class="e">🃏</span>Hahmokortit<small>${nc}/${PACK.characters.length} kerätty</small></button>
      <button class="tile" data-g="parent"><span class="e">👨‍👩‍👧</span>Aikuiselle<small>Edistyminen</small></button>
    </div>`;
  $$('[data-ch]').forEach(b => b.onclick = () => go(() => chapterQuiz(b.dataset.ch)));
  const G = {miss:missQuiz, timeline, whoami, match, exam, cards, parent};
  $$('[data-g]').forEach(b => b.onclick = () => go(G[b.dataset.g]));
}

// ---------- KYSYMYSKIERROS ----------
function runQuiz(qs, done){
  let i = 0, score = 0, combo = 0;
  const show = () => {
    const q = qs[i];
    const opts = q.type === 'tf' ? q.options : shuffle([q.answer, ...q.wrong]);
    const tag = {mc:'Kysymys', tf:'Totta vai tarua?', who:'Kuka sanoi?', koe:'⭐ Koekysymys'}[q.type];
    const body = q.type === 'who' ? `<div class="quote">”${esc(q.text)}”</div>` : `<div class="q">${esc(q.text)}</div>`;
    const sayT = (q.type==='who' ? 'Kuka sanoi: ' : q.type==='tf' ? 'Totta vai tarua: ' : '') + q.text + '. ' + (q.type==='tf' ? '' : opts.join('. '));
    app.innerHTML = `
      <div class="top"><button class="back" id="x">✕</button><div class="bar"><i style="width:${i/qs.length*100}%"></i></div><span class="chip">${i+1}/${qs.length}</span></div>
      <div class="qcard"><button class="spk" data-say="${esc(sayT)}" aria-label="Lue ääneen">🔊</button><span class="tag ${q.type==='koe'?'koe':''}">${tag}</span>${body}</div>
      <div class="opts ${q.type==='tf'?'row':''}">${opts.map((o,k) => `<button class="opt" data-k="${k}">${q.type==='tf' ? (o==='Totta'?'👍 ':'👎 ') : ''}${esc(o)}</button>`).join('')}</div>
      <div id="fb"></div>`;
    $('#x').onclick = () => { if (confirm('Lopetetaanko kierros?')) go(home); };
    let answered = false;
    $$('.opt').forEach(b => b.onclick = () => {
      if (answered) return; answered = true;
      const ok = opts[+b.dataset.k] === q.answer;
      $$('.opt').forEach(x => { const v = opts[+x.dataset.k]; if (v === q.answer) x.classList.add('ok'); else if (x !== b) x.classList.add('dim'); });
      if (ok) { score++; combo++; S.xp += 10 + (combo >= 3 ? 5 : 0); delete S.miss[q.id]; beep(true); }
      else { combo = 0; S.miss[q.id] = 1; b.classList.add('no'); shake(b); beep(false); }
      save();
      const comboT = ok && combo >= 3 ? ` <span class="combo">🔥 ${combo} putkeen!</span>` : '';
      $('#fb').innerHTML = `<div class="fb ${ok?'ok':'no'}"><b>${ok ? pick(PRAISE) : pick(TRY) + ' Oikea vastaus: ' + esc(q.answer)}</b>${comboT}<br>${esc(q.explain)}</div>
        <button class="big" id="nx">${i+1 < qs.length ? 'Seuraava ➜' : 'Katso tulos'}</button>`;
      $('#nx').onclick = () => { i++; if (i < qs.length) go(show); else { touchDay(); save(); go(() => done(score, qs.length)); } };
      $('#fb').scrollIntoView({behavior:'smooth', block:'nearest'});
    });
  };
  show();
}

function starsFor(p){ return p >= .9 ? 3 : p >= .7 ? 2 : p >= .5 ? 1 : 0; }

function resultScreen({emoji, title, line, stars, extra='', again, againLabel='Pelaa uudestaan'}){
  if (stars >= 2) { confetti(); }
  app.innerHTML = `
    <div class="center">
      <div class="huge">${emoji}</div>
      <h2>${esc(title)}</h2>
      ${stars !== undefined ? `<div class="stars">${starStr(stars)}</div>` : ''}
      <p class="sub" style="font-size:17px">${line}</p>
      ${extra}
    </div>
    <button class="big" id="ag">${againLabel}</button>
    <button class="big alt" id="hm">🗺️ Takaisin kartalle</button>`;
  $('#ag').onclick = () => go(again);
  $('#hm').onclick = () => go(home);
}

function chapterQuiz(chId){
  const ch = PACK.chapters.find(c => c.id === chId);
  const all = QS.filter(q => q.ch === chId);
  const missed = shuffle(all.filter(q => S.miss[q.id]));
  const rest = shuffle(all.filter(q => !S.miss[q.id]));
  const qs = shuffle([...missed, ...rest].slice(0, Math.min(10, all.length)));
  runQuiz(qs, (score, n) => {
    const p = score/n, st = starsFor(p);
    S.best[chId] = Math.max(S.best[chId]||0, Math.round(p*100));
    S.stars[chId] = Math.max(S.stars[chId]||0, st);
    let newCards = [];
    if (st >= 1) ch.cards.forEach(c => { if (!S.cards[c]) { S.cards[c] = 1; newCards.push(c); } });
    save();
    const extra = newCards.length ? `<div class="qcard"><b>🃏 Uusi hahmokortti!</b><br>${newCards.map(n => { const c = PACK.characters.find(x=>x.name===n); return (c?c.emoji+' ':'') + esc(n); }).join(', ')}</div>`
      : st === 0 ? `<p class="small">Tarvitset vähintään puolet oikein saadaksesi tähden ja hahmokortin.</p>` : '';
    resultScreen({emoji: st===3?'🏆':st>=1?'🎉':'💪', title: ch.title, stars: st,
      line: `${score} / ${n} oikein`, extra, again: () => chapterQuiz(chId)});
  });
}

function missQuiz(){
  const qs = shuffle(Object.keys(S.miss).map(qById).filter(Boolean)).slice(0, 12);
  if (!qs.length) return home();
  runQuiz(qs, (score, n) => {
    const left = Object.keys(S.miss).filter(qById).length;
    resultScreen({emoji: left ? '🎯' : '🏆', title: 'Virheiden kertaus', line: `${score} / ${n} oikein. ${left ? `Vielä ${left} kerrattavaa.` : 'Kaikki virheet korjattu!'}`,
      stars: starsFor(score/n), again: left ? missQuiz : home, againLabel: left ? 'Jatka kertaamista' : 'Valmis!'});
  });
}

function exam(){
  const koe = QS.filter(q => q.type === 'koe');
  const others = shuffle(QS.filter(q => q.type !== 'koe')).slice(0, Math.max(0, 20 - koe.length));
  runQuiz(shuffle([...koe, ...others]), (score, n) => {
    const p = score/n; S.games.exam = Math.max(S.games.exam||0, Math.round(p*100)); S.xp += 30; save();
    resultScreen({emoji: p>=.85?'🏆':p>=.6?'👍':'📚', title:'Harjoituskoe', stars: starsFor(p),
      line: `${score} / ${n} oikein (${Math.round(p*100)} %)<br>${p>=.85 ? 'Olet valmis kokeeseen!' : p>=.6 ? 'Hyvä! Kertaa vielä virheet.' : 'Kertaa kappaleita ja virheitä, sitten uusi yritys.'}`,
      again: exam});
  });
}

function finishGame(key, title, score, max, again){
  const p = score / max; S.games[key] = Math.max(S.games[key]||0, Math.round(p*100)); S.xp += Math.round(p*40); touchDay(); save();
  resultScreen({emoji: p>=.9?'🏆':p>=.6?'🎉':'💪', title, stars: starsFor(p), line: `${score} / ${max} pistettä`, again});
}

// ---------- AIKAJANA ----------
function timeline(){
  const ROUNDS = 3, PER = 5; let round = 0, mistakes = 0;
  const next = () => {
    if (round === ROUNDS) return finishGame('timeline', 'Aikajana', Math.max(0, ROUNDS*PER - mistakes), ROUNDS*PER, timeline);
    const idxs = shuffle(PACK.timeline.map((_,k)=>k)).slice(0, PER).sort((a,b)=>a-b);
    let pos = 0; const pool = shuffle(idxs);
    const draw = () => {
      app.innerHTML = `
        <div class="top"><button class="back" id="x">✕</button><span class="chip">Kierros ${round+1}/${ROUNDS}</span><span class="chip">❌ ${mistakes}</span></div>
        <h2>📜 Mikä tapahtui ensin?</h2><p class="sub">Napauta tapahtumat oikeaan järjestykseen.</p>
        ${idxs.map((ix,k) => k < pos ? `<div class="slot done"><b>${k+1}</b>${esc(PACK.timeline[ix])}</div>` : `<div class="slot"><b>${k+1}</b>…</div>`).join('')}
        <div class="opts" style="margin-top:14px">${pool.filter(ix => idxs.indexOf(ix) >= pos).map(ix => `<button class="opt" data-ix="${ix}">${esc(PACK.timeline[ix])}</button>`).join('')}</div>
        <div id="fb"></div>`;
      $('#x').onclick = () => { if (confirm('Lopetetaanko peli?')) go(home); };
      if (pos === PER) {
        beep(true);
        $('#fb').innerHTML = `<div class="fb ok"><b>${pick(PRAISE)}</b> Järjestys on oikein.</div><button class="big" id="nx">${round+1<ROUNDS?'Seuraava kierros ➜':'Katso tulos'}</button>`;
        $('#nx').onclick = () => { round++; go(next); };
        return;
      }
      $$('[data-ix]').forEach(b => b.onclick = () => {
        if (+b.dataset.ix === idxs[pos]) { pos++; draw(); }
        else { mistakes++; b.classList.add('no'); shake(b); beep(false); setTimeout(() => b.classList.remove('no'), 500); app.querySelector('.top .chip:last-child').textContent = '❌ ' + mistakes; }
      });
    };
    draw();
  };
  next();
}

// ---------- KUKA MINÄ OLEN ----------
function whoami(){
  const ROUNDS = 5; const order = shuffle(PACK.characters).slice(0, ROUNDS); let round = 0, points = 0;
  const next = () => {
    if (round === ROUNDS) return finishGame('whoami', 'Kuka minä olen?', points, ROUNDS*3, whoami);
    const c = order[round]; let ci = 0, done = false;
    const opts = shuffle([c.name, ...shuffle(PACK.characters.filter(x => x.name !== c.name)).slice(0,3).map(x=>x.name)]);
    const disabled = new Set();
    const draw = (msg='') => {
      const maxP = Math.max(1, 3 - ci);
      app.innerHTML = `
        <div class="top"><button class="back" id="x">✕</button><span class="chip">Hahmo ${round+1}/${ROUNDS}</span><span class="chip">💎 ${points}</span></div>
        <h2>🕵️ Kuka minä olen?</h2><p class="sub">${done ? '' : `Arvaa nyt: ${maxP} ${maxP===1?'piste':'pistettä'}`}</p>
        ${c.clues.slice(0, ci+1).map((t,k) => `<div class="clue"><i>Vihje ${k+1}</i>${esc(t)}</div>`).join('')}
        ${!done && ci < c.clues.length-1 ? `<button class="big alt" id="more" style="margin:4px 0 14px">💡 Lisää vihje</button>` : '<div style="height:10px"></div>'}
        <div class="opts">${opts.map(o => `<button class="opt ${done && o===c.name?'ok':''} ${disabled.has(o)?'no':''}" data-o="${esc(o)}">${esc(o)}</button>`).join('')}</div>
        <div id="fb">${msg}</div>`;
      $('#x').onclick = () => { if (confirm('Lopetetaanko peli?')) go(home); };
      if (done) { $('#nx').onclick = () => { round++; go(next); }; return; }
      if ($('#more')) $('#more').onclick = () => { ci++; draw(); };
      $$('[data-o]').forEach(b => b.onclick = () => {
        const o = b.dataset.o; if (disabled.has(o)) return;
        if (o === c.name) {
          const got = Math.max(1, 3 - ci); points += got; done = true; beep(true);
          ci = c.clues.length - 1; S.cards[c.name] = 1; save();
          draw(`<div class="fb ok"><b>${pick(PRAISE)}</b> Olen ${esc(c.emoji)} ${esc(c.name)}! +${got}</div><button class="big" id="nx">${round+1<ROUNDS?'Seuraava hahmo ➜':'Katso tulos'}</button>`);
        } else {
          disabled.add(o); beep(false); if (ci < c.clues.length-1) ci++; draw(); shake($(`[data-o="${CSS.escape(o)}"]`));
        }
      });
    };
    draw();
  };
  next();
}

// ---------- SANAPARIT ----------
function match(){
  const ROUNDS = 3, PER = 4; const pool = shuffle(PACK.words); let round = 0, mistakes = 0;
  const next = () => {
    if (round === ROUNDS) return finishGame('match', 'Sanaparit', Math.max(0, ROUNDS*PER - mistakes), ROUNDS*PER, match);
    const set = pool.slice(round*PER, round*PER+PER); const defs = shuffle(set.map((_,k)=>k));
    const ok = new Set(); let sel = null;
    app.innerHTML = `
      <div class="top"><button class="back" id="x">✕</button><span class="chip">Kierros ${round+1}/${ROUNDS}</span><span class="chip">❌ <span id="mc">${mistakes}</span></span></div>
      <h2>🧩 Sanaparit</h2><p class="sub">Napauta ensin sana, sitten sen selitys.</p>
      <div class="match"><div class="col">${set.map((w,k) => `<button class="mt term" data-t="${k}">${esc(w[0])}</button>`).join('')}</div>
      <div class="col">${defs.map(k => `<button class="mt" data-d="${k}">${esc(set[k][1])}</button>`).join('')}</div></div>
      <div id="fb"></div>`;
    $('#x').onclick = () => { if (confirm('Lopetetaanko peli?')) go(home); };
    $$('[data-t]').forEach(b => b.onclick = () => { if (ok.has(+b.dataset.t)) return; $$('[data-t]').forEach(x=>x.classList.remove('sel')); b.classList.add('sel'); sel = +b.dataset.t; });
    $$('[data-d]').forEach(b => b.onclick = () => {
      const d = +b.dataset.d; if (ok.has(d)) return;
      if (sel === null) { shake(b); return; }
      if (d === sel) {
        ok.add(d); beep(true); b.classList.add('ok'); const t = $(`[data-t="${d}"]`); t.classList.remove('sel'); t.classList.add('ok'); sel = null;
        if (ok.size === PER) { $('#fb').innerHTML = `<div class="fb ok"><b>${pick(PRAISE)}</b> Kaikki parit löytyivät.</div><button class="big" id="nx">${round+1<ROUNDS?'Seuraava kierros ➜':'Katso tulos'}</button>`; $('#nx').onclick = () => { round++; go(next); }; }
      } else { mistakes++; $('#mc').textContent = mistakes; beep(false); shake(b); }
    });
  };
  next();
}

// ---------- HAHMOKORTIT ----------
function cards(){
  app.innerHTML = `
    <div class="top"><button class="back" id="x">← Kartta</button><span class="chip">🃏 ${Object.keys(S.cards).length}/${PACK.characters.length}</span></div>
    <h2>🃏 Hahmokortit</h2><p class="sub">Saat kortteja kappaleista ja Kuka minä olen? -pelistä.</p>
    <div class="cards">${PACK.characters.map(c => S.cards[c.name]
      ? `<div class="hc"><div class="e">${c.emoji}</div><b>${esc(c.name)}</b>${c.clues.map(t=>`<p>• ${esc(t)}</p>`).join('')}</div>`
      : `<div class="hc lock"><div class="e">❓</div><b>???</b></div>`).join('')}</div>`;
  $('#x').onclick = () => go(home);
}

// ---------- AIKUISELLE ----------
function parent(){
  const missed = Object.keys(S.miss).map(qById).filter(Boolean);
  const g = k => S.games[k] !== undefined ? S.games[k] + ' %' : '–';
  app.innerHTML = `
    <div class="top"><button class="back" id="x">← Kartta</button></div>
    <h2>👨‍👩‍👧 Aikuiselle</h2>
    <p class="small">Paras tulos per kappale. Edistyminen tallentuu vain tälle laitteelle.</p>
    <table>${PACK.chapters.map(c => `<tr><td>${c.no}. ${esc(c.title)}</td><td style="white-space:nowrap;text-align:right">${S.best[c.id]!==undefined?S.best[c.id]+' %':'–'} <span style="color:#c58b00">${starStr(S.stars[c.id]||0)}</span></td></tr>`).join('')}
      <tr><td>Harjoituskoe</td><td style="text-align:right">${g('exam')}</td></tr>
      <tr><td>Aikajana</td><td style="text-align:right">${g('timeline')}</td></tr>
      <tr><td>Kuka minä olen?</td><td style="text-align:right">${g('whoami')}</td></tr>
      <tr><td>Sanaparit</td><td style="text-align:right">${g('match')}</td></tr></table>
    <div class="sec">Vielä kertaamatta (${missed.length})</div>
    ${missed.length ? `<div class="mlist">${missed.map(q => `<div>${esc(q.type==='who'?'Kuka sanoi: ”'+q.text+'”':q.text)}<br><b>→ ${esc(q.answer)}</b></div>`).join('')}</div>` : '<p class="small">Ei virheitä jonossa.</p>'}
    <button class="big alt" id="rs" style="margin-top:24px">Nollaa edistyminen</button>`;
  $('#x').onclick = () => go(home);
  $('#rs').onclick = () => { if (confirm('Nollataanko kaikki tähdet, kortit ja pisteet?')) { S = defS(); save(); go(home); } };
}

home();
})();
</script>
