<style>

*{box-sizing:border-box}
html,body{margin:0;background:#f3dfb5;color:var(--ink)}
body{background:linear-gradient(#f9edd4,#efd7a6) fixed;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Rounded",system-ui,sans-serif;-webkit-tap-highlight-color:transparent;min-height:100vh;-webkit-text-size-adjust:100%}
#app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 28px)}
button{font:inherit;color:inherit;border:0;cursor:pointer;-webkit-user-select:none;user-select:none}
input{font:inherit}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.chip{background:#ffffffaa;border-radius:999px;padding:6px 12px;font-weight:700;font-size:15px;white-space:nowrap}
.back{background:#ffffffaa;border-radius:999px;padding:8px 14px;font-weight:800}
h1{font-size:26px;margin:6px 0 2px;color:var(--blue2);line-height:1.15}
h2{font-size:22px;margin:6px 0 10px;color:var(--blue2)}
.sub{color:var(--muted);margin:0 0 10px;font-size:15px}
.path{display:flex;flex-direction:column;gap:12px;margin:8px 0 8px}
.node{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:20px;padding:12px 14px;box-shadow:0 3px 0 #d9bf8a;text-align:left;width:100%}
.node:nth-child(even){margin-left:26px;width:calc(100% - 26px)}
.path.flat .node{margin-left:0;width:100%}
.node .ic{width:52px;height:52px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:26px;flex:none}
.node.full .ic{background:var(--gold)}
.node .nm{font-weight:800;font-size:16px;line-height:1.25}
.node .st{font-size:18px;letter-spacing:2px;color:#c58b00}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--card);border-radius:20px;padding:16px 10px;box-shadow:0 3px 0 #d9bf8a;text-align:center;font-weight:800;font-size:16px}
.tile .e{font-size:34px;display:block;margin-bottom:6px}
.tile small{display:block;font-weight:500;color:var(--muted);margin-top:4px;font-size:13px}

.q{font-size:21px;font-weight:700;line-height:1.35}
.quote{font-style:italic;font-size:20px;line-height:1.4;border-left:5px solid var(--gold);padding-left:12px}
.opts{display:flex;flex-direction:column;gap:10px}

.st-veh{position:absolute;left:10px;bottom:14px;font-size:56px;line-height:1}
.stage.sm .st-veh{font-size:44px}
.pet{position:absolute;left:50%;bottom:6px;line-height:0;transform:translateX(-50%);animation:bob 2.4s ease-in-out infinite}

.shop{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.item{background:var(--card);border-radius:18px;padding:10px 6px 9px;box-shadow:0 3px 0 #d9bf8a;text-align:center;position:relative}
.item .e{font-size:40px;display:block;line-height:1.15}
.item .n{display:block;font-size:13px;font-weight:700;margin:3px 0 2px;line-height:1.2;min-height:2.4em}

.item.own .p{background:#e3e9f7;color:var(--blue2)}
.item.on{outline:3px solid var(--green);outline-offset:-3px}
.item.on .p{background:var(--green);color:#fff}
.item.poor{opacity:.55}
.msg{min-height:22px;margin:4px 2px 8px;font-weight:700;color:var(--blue2);font-size:15px}
.namebox{width:100%;font-size:20px;padding:14px;border-radius:16px;border:2px solid #d6c7a8;background:#fff;margin-top:8px}
.pick{background:var(--card);border-radius:20px;padding:10px 0;box-shadow:0 3px 0 #d9bf8a}
.pick.sel{outline:4px solid var(--blue);outline-offset:-4px;background:#fff}
.pk{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:20px;padding:14px;box-shadow:0 3px 0 #d9bf8a;text-align:left;width:100%;margin-bottom:12px}
.pk .ic{width:56px;height:56px;border-radius:16px;background:var(--blue);display:grid;place-items:center;font-size:30px;flex:none}
.pk b{display:block;font-size:17px}
.pk span{font-size:14px;color:var(--muted)}
/* Uusi koe kuvista */
.lbl{display:block;font-weight:700;margin:16px 2px 0;font-size:15px}
.filebtn{text-align:center;cursor:pointer}
.thumbs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}
.thumbs img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:8px;display:block}
.rq{background:var(--card);border-radius:14px;padding:10px 46px 10px 12px;margin-bottom:8px;position:relative;font-size:15px;line-height:1.35;box-shadow:0 2px 0 #e2cfa6}

.rq .ok{color:var(--green);font-weight:700}
.rx{position:absolute;right:8px;top:8px;width:32px;height:32px;border-radius:50%;background:#fbe1de;color:var(--red);font-weight:800}
.pulse{display:inline-block;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.2) rotate(10deg)}}
</style>

<!-- ============ VERSIO: päivitä sama arvo tähän, version.txt:hen ja pakettien ?v=-parametreihin joka julkaisussa ============ -->
<script>
window.APP_VERSION = '2026-11-16d';
// Palvelinfunktion osoite (Cloudflare Worker). Tyhjä = kuvista tekeminen ei ole vielä käytössä.
window.KP_API = '';
(function(){
  // Hakee version.txt:n ohi välimuistin. Jos julkaistu versio on uudempi, ladataan sivu uudella osoitteella (ohittaa vanhan kopion).
  function check(){
    try {
      var last = +(sessionStorage.getItem('kp_upd') || 0);
      if (Date.now() - last < 60000) return;
      fetch('version.txt?t=' + Date.now(), {cache:'no-store'}).then(function(r){ return r.ok ? r.text() : ''; }).then(function(v){
        v = (v || '').trim();
        if (v && v !== window.APP_VERSION) { sessionStorage.setItem('kp_upd', String(Date.now())); location.replace(location.pathname + '?v=' + encodeURIComponent(v)); }
      }).catch(function(){});
    } catch(e){}
  }
  check();
  document.addEventListener('visibilitychange', function(){ if (!document.hidden) check(); });
})();
</script>

<!-- ============ PELIMOOTTORI (sama kaikille aineille) ============ -->
<script>
(function(){
const PACKS = window.PACKS || [];
const app = document.getElementById('app');
const $ = s => app.querySelector(s);
const $$ = s => Array.from(app.querySelectorAll(s));
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.random()*(i+1)|0; [a[i],a[j]]=[a[j],a[i]]; } return a; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const starStr = n => '★'.repeat(n) + '☆'.repeat(3-n);
const pick = a => a[Math.random()*a.length|0];
const PRAISE = ['Hienoa!','Mahtavaa!','Oikein!','Loistavaa!','Juuri niin!','Huippua!'];
const TRY = ['Melkein!','Ei haittaa!','Ensi kerralla!','Hyvä yritys!'];
const store = {
  get(k){ try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};

// ================= VERKOSTA HAETUT KOKEET (tehty kuvista sovelluksessa) =================
const API = String(window.KP_API || '').replace(/\/+$/, '');
let screen = '';
function addRemote(list){
  let changed = false;
  (list || []).forEach(p => {
    if (!p || !p.id || !Array.isArray(p.chapters)) return;
    const np = Object.assign({remote:true}, p), i = PACKS.findIndex(x => x.id === p.id);
    if (i < 0) { PACKS.push(np); changed = true; }
    else if (PACKS[i].remote && JSON.stringify(PACKS[i]) !== JSON.stringify(np)) { PACKS[i] = np; changed = true; }
  });
  return changed;
}
function syncRemote(){
  if (!API) return Promise.resolve();
  return fetch(API + '/packs', {cache:'no-store'}).then(r => r.ok ? r.json() : null).then(d => {
    if (!d || !Array.isArray(d.packs)) return;
    store.set('kp_remote', d.packs);
    let changed = false;
    for (let i = PACKS.length-1; i >= 0; i--) if (PACKS[i].remote && !d.packs.some(p => p.id === PACKS[i].id)) { PACKS.splice(i,1); changed = true; }
    if (addRemote(d.packs) || changed) { if (screen === 'main') mainHome(); }
  }).catch(() => {});
}
addRemote(store.get('kp_remote'));

// ================= LEMMIKKIKAUPPA (sama kaikille aineille) =================
// [id, emoji, nimi, hinta]  · ruoissa viides arvo = montako ruokintaa
const SHOP = {
  animal:{ t:'Eläimet', i:'🐾', items:[
    ['cat','🐱','Kissa',0],['dog','🐶','Koira',0],['rabbit','🐰','Pupu',0],['hamster','🐹','Hamsteri',0],
    ['frog','🐸','Sammakko',200],['chick','🐥','Tipu',250],['penguin','🐧','Pingviini',300],['fox','🦊','Kettu',400],
    ['turtle','🐢','Kilpikonna',450],['koala','🐨','Koala',500],['panda','🐼','Panda',600],['monkey','🐵','Apina',600],
    ['owl','🦉','Pöllö',700],['pig','🐷','Possu',350],['cow','🐮','Lehmä',400],['bear','🐻','Karhu',700],
    ['lion','🦁','Leijona',900],['tiger','🐯','Tiikeri',900],['unicorn','🦄','Yksisarvinen',1500],['dino','🦖','Dinosaurus',2000],['dragon','🐲','Lohikäärme',2500]]},
  hat:{ t:'Hatut', i:'🎩', items:[
    ['cap','🧢','Lippis',100],['flower','🌸','Kukka',120],['bow','🎀','Rusetti',150],['sunhat','👒','Kesähattu',200],
    ['helmet','⛑️','Kypärä',250],['tophat','🎩','Silinteri',300],['phones','🎧','Kuulokkeet',350],['grad','🎓','Lakki',400],
    ['star','⭐','Tähti',500],['crown','👑','Kruunu',800]]},
  outfit:{ t:'Asut', i:'👕', items:[
    ['scarf','🧣','Kaulahuivi',100],['tshirt','👕','T-paita',120],['tie','👔','Solmio',150],['jersey','🎽','Urheilupaita',200],
    ['vest','🦺','Huomioliivi',200],['dress','👗','Mekko',250],['coat','🧥','Takki',300],['karate','🥋','Karatepuku',400],
    ['medal','🏅','Mitali',600],['cape','🦸','Viitta',1000]]},
  glasses:{ t:'Lasit', i:'🕶️', items:[
    ['specs','👓','Silmälasit',150],['shades','🕶️','Aurinkolasit',250],['goggles','🥽','Laskettelulasit',350]]},
  food:{ t:'Ruoat', i:'🍎', items:[
    ['apple','🍎','Omena',15,1],['carrot','🥕','Porkkana',15,1],['banana','🍌','Banaani',20,1],['cheese','🧀','Juusto',25,1],
    ['croissant','🥐','Croissant',30,1],['pizza','🍕','Pizza',40,2],['burger','🍔','Hampurilainen',40,2],['sushi','🍣','Sushi',50,2],
    ['icecream','🍦','Jäätelö',50,2],['cake','🎂','Kakku',100,5]]},
  vehicle:{ t:'Kulkuneuvot', i:'🚲', items:[
    ['kick','🛴','Potkulauta',200],['skate','🛹','Rullalauta',250],['bike','🚲','Pyörä',300],['scooter','🛵','Skootteri',500],
    ['car','🚗','Auto',800],['sail','⛵','Purjevene',900],['train','🚂','Juna',1000],['race','🏎️','Kilpa-auto',1200],
    ['heli','🚁','Helikopteri',1500],['rocket','🚀','Raketti',2500],['ufo','🛸','Ufo',3000]]},
  home:{ t:'Kodit', i:'🏠', items:[
    ['tent','⛺','Teltta',200],['hut','🛖','Maja',300],['camp','🏕️','Leiri',400],['house','🏠','Talo',600],
    ['garden','🏡','Puutarhatalo',900],['island','🏝️','Saari',1800],['palace','🏯','Palatsi',2000],['castle','🏰','Linna',2500]]}
};
const ITEM = {};
Object.entries(SHOP).forEach(([slot,c]) => c.items.forEach(r => ITEM[r[0]] = {id:r[0], e:r[1], name:r[2], price:r[3], feeds:r[4]||0, slot}));

// ================= YHTEINEN LOMPAKKO & LEMMIKKI =================
const GKEY = 'kp_global';
const defG = () => ({gems:0, earned:0, streak:{n:0,last:''}, owned:{}, pet:{animal:null,name:'',fed:0,hat:null,outfit:null,glasses:null,vehicle:null,home:null}});
let G = store.get(GKEY);
if (!G) {
  G = defG();
  // Siirretään aiemmin kerätyt timantit ja putki vanhoista koekohtaisista tallennuksista
  PACKS.forEach(p => { const s = store.get('kp_'+p.id); if (s) { G.gems += s.xp||0; G.earned += s.xp||0; if (s.streak && (s.streak.n||0) > G.streak.n) G.streak = s.streak; } });
} else { const d = defG(); G = Object.assign(d, G); G.pet = Object.assign(d.pet, G.pet || {}); }
// Pokaali vaihtui viitaksi (pokaalia ei voi pukea)
if (G.owned.trophy) { G.owned.cape = 1; delete G.owned.trophy; }
if (G.pet.outfit === 'trophy') G.pet.outfit = 'cape';
const saveG = () => store.set(GKEY, G);
saveG();
const petLevel = () => 1 + Math.floor(G.pet.fed / 5);

function dayStr(d){ return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
function touchDay(){
  const today = dayStr(new Date()), y = new Date(); y.setDate(y.getDate()-1);
  if (G.streak.last === today) return;
  G.streak.n = (G.streak.last === dayStr(y)) ? G.streak.n + 1 : 1;
  G.streak.last = today;
}

// ================= KOEKOHTAINEN TILA =================
let PACK = null, QS = [], CORE = [], S = null, KEY = '', startEarned = 0;
const defS = () => ({stars:{}, best:{}, miss:{}, cards:{}, games:{}, xp:0});
const save = () => { if (S) store.set(KEY, S); saveG(); };
function gem(n){ G.gems += n; G.earned += n; if (S) S.xp = (S.xp||0) + n; }

function openPack(p){
  PACK = p; KEY = 'kp_' + p.id;
  S = Object.assign(defS(), store.get(KEY) || {});
  QS = [];
  const addQ = (ch, r, bonus) => {
    const id = ch.id + ':' + r[1];
    if (r[0] === 'tf') QS.push({id, ch:ch.id, bonus, type:'tf', text:r[1], answer: r[2] ? 'Totta' : 'Tarua', options:['Totta','Tarua'], explain:r[3]||''});
    else QS.push({id, ch:ch.id, bonus, type:r[0], text:r[1], answer:r[2], wrong:r[3], explain:r[4]||''});
  };
  p.chapters.forEach(ch => { ch.q.forEach(r => addQ(ch, r, false)); (ch.bonus||[]).forEach(r => addQ(ch, r, true)); });
  const BW = (p.words||[]).filter(w => w[2]);
  BW.forEach(w => QS.push({id:'w:'+w[0], ch:'', bonus:true, type:'mc', text:'Mitä tarkoittaa ”'+w[0]+'”?', answer:w[1], wrong:shuffle(BW.filter(x=>x!==w).map(x=>x[1])).slice(0,3), explain:''}));
  CORE = QS.filter(q => !q.bonus);
}
const qById = id => QS.find(q => q.id === id);
function packStars(p){ const s = store.get('kp_'+p.id) || {}; return p.chapters.reduce((a,c) => a + ((s.stars||{})[c.id]||0), 0); }

let AC;
function beep(ok){
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain(); o.connect(g); g.connect(AC.destination);
    const t = AC.currentTime; o.type = 'triangle';
    if (ok) { o.frequency.setValueAtTime(660,t); o.frequency.setValueAtTime(990,t+.09); }
    else { o.frequency.setValueAtTime(240,t); o.frequency.setValueAtTime(170,t+.12); }
    g.gain.setValueAtTime(.14,t); g.gain.exponentialRampToValueAtTime(.001,t+.32); o.start(t); o.stop(t+.33);
  } catch(e){}
}
function say(t){
  try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang='fi-FI'; u.rate=.95;
    const v = speechSynthesis.getVoices().find(v => v.lang && v.lang.toLowerCase().startsWith('fi')); if (v) u.voice = v;
    speechSynthesis.speak(u); } catch(e){}
}
app.addEventListener('click', e => { const b = e.target.closest('[data-say]'); if (b) say(b.dataset.say); });
function confetti(){
  const d = document.createElement('div'); d.className = 'confetti';
  const em = ['⭐','🎉','✨','🌟','💎'];
  for (let i=0;i<34;i++){ const s=document.createElement('span'); s.textContent=pick(em); s.style.left=(Math.random()*100)+'%'; s.style.animationDelay=(Math.random()*.8)+'s'; d.appendChild(s); }
  document.body.appendChild(d); setTimeout(() => d.remove(), 3400);
}
function shake(el){ if (!el) return; el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }
function hearts(em, n){
  const st = $('.stage'); if (!st) return;
  for (let i=0;i<n;i++){ const h = document.createElement('span'); h.className='heart'; h.textContent = em; h.style.left = (40 + Math.random()*20)+'%'; h.style.bottom = (60 + Math.random()*30)+'px'; h.style.animationDelay = (i*.12)+'s'; st.appendChild(h); setTimeout(() => h.remove(), 1800); }
}

function runQuiz(qs, done){
  let i = 0, score = 0, combo = 0; startEarned = G.earned;
  const show = () => {
    const q = qs[i];
    const opts = q.type === 'tf' ? q.options : shuffle([q.answer, ...q.wrong]);
    const tag = (q.bonus ? '💡 Bonus · ' : '') + {mc:'Kysymys', tf:'Totta vai tarua?', who:'Kuka sanoi?', koe:'⭐ Koekysymys'}[q.type];
    const body = q.type === 'who' ? `<div class="quote">”${esc(q.text)}”</div>` : `<div class="q">${esc(q.text)}</div>`;
    const sayT = (q.type==='who' ? 'Kuka sanoi: ' : q.type==='tf' ? 'Totta vai tarua: ' : '') + q.text + '. ' + (q.type==='tf' ? '' : opts.join('. '));
    app.innerHTML = `
      <div class="top"><button class="back" id="x">✕</button><div class="bar"><i style="width:${i/qs.length*100}%"></i></div><span class="chip">${i+1}/${qs.length}</span></div>
      <div class="qcard"><button class="spk" data-say="${esc(sayT)}" aria-label="Lue ääneen">🔊</button><span class="tag ${q.type==='koe'?'koe':''}">${tag}</span>${body}</div>
      <div class="opts ${q.type==='tf'?'row':''}">${opts.map((o,k) => `<button class="opt" data-k="${k}">${q.type==='tf' ? (o==='Totta'?'👍 ':'👎 ') : ''}${esc(o)}</button>`).join('')}</div>
      <div id="fb"></div>`;
    $('#x').onclick = () => { if (confirm('Lopetetaanko kierros?')) { save(); go(packHome); } };
    let answered = false;
    $$('.opt').forEach(b => b.onclick = () => {
      if (answered) return; answered = true;
      const ok = opts[+b.dataset.k] === q.answer;
      $$('.opt').forEach(x => { const v = opts[+x.dataset.k]; if (v === q.answer) x.classList.add('ok'); else if (x !== b) x.classList.add('dim'); });
      let got = 0;
      if (ok) { score++; combo++; got = 10 + (combo >= 3 ? 5 : 0); gem(got); delete S.miss[q.id]; beep(true); }
      else { combo = 0; if (!q.bonus) S.miss[q.id] = 1; b.classList.add('no'); shake(b); beep(false); }
      save();
      const comboT = ok && combo >= 3 ? ` <span class="combo">🔥 ${combo} putkeen!</span>` : '';
      $('#fb').innerHTML = `<div class="fb ${ok?'ok':'no'}"><b>${ok ? pick(PRAISE) + ' +' + got + ' 💎' : pick(TRY) + ' Oikea vastaus: ' + esc(q.answer)}</b>${comboT}${q.explain ? '<br>' + esc(q.explain) : ''}</div>
        <button class="big" id="nx">${i+1 < qs.length ? 'Seuraava ➜' : 'Katso tulos'}</button>`;
      $('#nx').onclick = () => { i++; if (i < qs.length) go(show); else { touchDay(); save(); go(() => done(score, qs.length)); } };
      $('#fb').scrollIntoView({behavior:'smooth', block:'nearest'});
    });
  };
  show();
}

function starsFor(p){ return p >= .9 ? 3 : p >= .7 ? 2 : p >= .5 ? 1 : 0; }

function resultScreen({emoji, title, line, stars, extra='', again, againLabel='Pelaa uudestaan'}){

    <button class="big pink" id="pt">🐾 Lemmikille</button>

  $('#pt').onclick = () => go(mainHome);

function chapterQuiz(chId){
  const ch = PACK.chapters.find(c => c.id === chId);
  const all = CORE.filter(q => q.ch === chId);
  const missed = shuffle(all.filter(q => S.miss[q.id]));
  const rest = shuffle(all.filter(q => !S.miss[q.id]));
  const qs = shuffle([...missed, ...rest].slice(0, Math.min(10, all.length)));
  runQuiz(qs, (score, n) => {
    const p = score/n, st = starsFor(p);
    S.best[chId] = Math.max(S.best[chId]||0, Math.round(p*100));
    S.stars[chId] = Math.max(S.stars[chId]||0, st);
    let newCards = [];
    if (st >= 1) (ch.cards||[]).forEach(c => { if (!S.cards[c]) { S.cards[c] = 1; newCards.push(c); } });
    save();
    const extra = newCards.length ? `<div class="qcard"><b>🃏 Uusi hahmokortti!</b><br>${newCards.map(n => { const c = (PACK.characters||[]).find(x=>x.name===n); return (c?c.emoji+' ':'') + esc(n); }).join(', ')}</div>`
      : st === 0 ? `<p class="small">Tarvitset vähintään puolet oikein saadaksesi tähden${(ch.cards||[]).length ? ' ja hahmokortin' : ''}.</p>` : '';
    resultScreen({emoji: st===3?'🏆':st>=1?'🎉':'💪', title: ch.title, stars: st, line: `${score} / ${n} oikein`, extra, again: () => chapterQuiz(chId)});
  });
}

function missQuiz(){
  const qs = shuffle(Object.keys(S.miss).map(qById).filter(Boolean)).slice(0, 12);
  if (!qs.length) return packHome();
  runQuiz(qs, (score, n) => {
    const left = Object.keys(S.miss).filter(qById).length;
    resultScreen({emoji: left ? '🎯' : '🏆', title: 'Virheiden kertaus', line: `${score} / ${n} oikein. ${left ? `Vielä ${left} kerrattavaa.` : 'Kaikki virheet korjattu!'}`,
      stars: starsFor(score/n), again: left ? missQuiz : packHome, againLabel: left ? 'Jatka kertaamista' : 'Valmis!'});
  });
}

function exam(){
  const koe = CORE.filter(q => q.type === 'koe');
  const others = shuffle(CORE.filter(q => q.type !== 'koe')).slice(0, Math.max(0, 20 - koe.length));
  runQuiz(shuffle([...koe, ...others]), (score, n) => {
    const p = score/n; S.games.exam = Math.max(S.games.exam||0, Math.round(p*100)); gem(30); save();
    resultScreen({emoji: p>=.85?'🏆':p>=.6?'👍':'📚', title:'Harjoituskoe', stars: starsFor(p),
      line: `${score} / ${n} oikein (${Math.round(p*100)} %)<br>${p>=.85 ? 'Olet valmis kokeeseen!' : p>=.6 ? 'Hyvä! Kertaa vielä virheet.' : 'Kertaa kappaleita ja virheitä, sitten uusi yritys.'}`,
      again: exam});
  });
}

function bonusQuiz(){
  const qs = shuffle(QS.filter(q => q.bonus)).slice(0, 12);
  runQuiz(qs, (score, n) => {
    const p = score/n; S.games.bonus = Math.max(S.games.bonus||0, Math.round(p*100)); gem(20); save();
    resultScreen({emoji: p>=.9?'🏆':'💡', title:'Bonustietoa', stars: starsFor(p),
      line: `${score} / ${n} oikein<br><span class="small">Lue lisää -laatikoiden tietoa – hyvää lisäoppia, mutta ei kokeen pääasiaa.</span>`, again: bonusQuiz});
  });
}

function finishGame(key, title, score, max, again){
  const p = score / max; S.games[key] = Math.max(S.games[key]||0, Math.round(p*100)); gem(Math.round(p*40)); touchDay(); save();
  resultScreen({emoji: p>=.9?'🏆':p>=.6?'🎉':'💪', title, stars: starsFor(p), line: `${score} / ${max} pistettä`, again});
}

function timeline(){
  const ROUNDS = 3, PER = 5; let round = 0, mistakes = 0; startEarned = G.earned;
  const next = () => {
    if (round === ROUNDS) return finishGame('timeline', 'Aikajana', Math.max(0, ROUNDS*PER - mistakes), ROUNDS*PER, timeline);
    const idxs = shuffle(PACK.timeline.map((_,k)=>k)).slice(0, PER).sort((a,b)=>a-b);
    let pos = 0; const pool = shuffle(idxs);
    const draw = () => {
      app.innerHTML = `
        <div class="top"><button class="back" id="x">✕</button><span class="chip">Kierros ${round+1}/${ROUNDS}</span><span class="chip" id="mc">❌ ${mistakes}</span></div>
        <h2>📜 Mikä tapahtui ensin?</h2><p class="sub">Napauta tapahtumat oikeaan järjestykseen.</p>
        ${idxs.map((ix,k) => k < pos ? `<div class="slot done"><b>${k+1}</b>${esc(PACK.timeline[ix])}</div>` : `<div class="slot"><b>${k+1}</b>…</div>`).join('')}
        <div class="opts" style="margin-top:14px">${pool.filter(ix => idxs.indexOf(ix) >= pos).map(ix => `<button class="opt" data-ix="${ix}">${esc(PACK.timeline[ix])}</button>`).join('')}</div>
        <div id="fb"></div>`;
      $('#x').onclick = exitGame;
      if (pos === PER) {
        beep(true);
        $('#fb').innerHTML = `<div class="fb ok"><b>${pick(PRAISE)}</b> Järjestys on oikein.</div><button class="big" id="nx">${round+1<ROUNDS?'Seuraava kierros ➜':'Katso tulos'}</button>`;
        $('#nx').onclick = () => { round++; go(next); };
        return;
      }
      $$('[data-ix]').forEach(b => b.onclick = () => {
        if (+b.dataset.ix === idxs[pos]) { pos++; draw(); }
        else { mistakes++; b.classList.add('no'); shake(b); beep(false); setTimeout(() => b.classList.remove('no'), 500); $('#mc').textContent = '❌ ' + mistakes; }
      });
    };
    draw();
  };
  next();
}

// ---------- KUKA MINÄ OLEN ----------
function whoami(){
  const ROUNDS = Math.min(5, PACK.characters.length); const order = shuffle(PACK.characters).slice(0, ROUNDS); let round = 0, points = 0; startEarned = G.earned;
  const next = () => {
    if (round === ROUNDS) return finishGame('whoami', 'Kuka minä olen?', points, ROUNDS*3, whoami);
    const c = order[round]; let ci = 0, done = false;
    const opts = shuffle([c.name, ...shuffle(PACK.characters.filter(x => x.name !== c.name)).slice(0,3).map(x=>x.name)]);
    const disabled = new Set();
    const draw = (msg='') => {
      const maxP = Math.max(1, 3 - ci);
      app.innerHTML = `
        <div class="top"><button class="back" id="x">✕</button><span class="chip">Hahmo ${round+1}/${ROUNDS}</span><span class="chip">⭐ ${points}</span></div>
        <h2>🕵️ Kuka minä olen?</h2><p class="sub">${done ? '' : `Arvaa nyt: ${maxP} ${maxP===1?'piste':'pistettä'}`}</p>
        ${c.clues.slice(0, ci+1).map((t,k) => `<div class="clue"><i>Vihje ${k+1}</i>${esc(t)}</div>`).join('')}
        ${!done && ci < c.clues.length-1 ? `<button class="big alt" id="more" style="margin:4px 0 14px">💡 Lisää vihje</button>` : '<div style="height:10px"></div>'}
        <div class="opts">${opts.map(o => `<button class="opt ${done && o===c.name?'ok':''} ${disabled.has(o)?'no':''}" data-o="${esc(o)}">${esc(o)}</button>`).join('')}</div>
        <div id="fb">${msg}</div>`;
      $('#x').onclick = exitGame;
      if (done) { $('#nx').onclick = () => { round++; go(next); }; return; }
      if ($('#more')) $('#more').onclick = () => { ci++; draw(); };
      $$('[data-o]').forEach(b => b.onclick = () => {
        const o = b.dataset.o; if (disabled.has(o)) return;
        if (o === c.name) {
          const got = Math.max(1, 3 - ci); points += got; done = true; beep(true);
          ci = c.clues.length - 1; S.cards[c.name] = 1; save();
          draw(`<div class="fb ok"><b>${pick(PRAISE)}</b> Olen ${esc(c.emoji)} ${esc(c.name)}! +${got}</div><button class="big" id="nx">${round+1<ROUNDS?'Seuraava hahmo ➜':'Katso tulos'}</button>`);
        } else {
          disabled.add(o); beep(false); if (ci < c.clues.length-1) ci++; draw(); shake($(`[data-o="${CSS.escape(o)}"]`));
        }
      });
    };
    draw();
  };
  next();
}

// ---------- SANAPARIT ----------
function match(){
  const words = PACK.words.filter(w => !w[2]);
  const PER = words.length >= 8 ? 4 : 3, ROUNDS = Math.max(1, Math.min(3, Math.floor(words.length / PER)));
  const pool = shuffle(words); let round = 0, mistakes = 0; startEarned = G.earned;
  const next = () => {
    if (round === ROUNDS) return finishGame('match', 'Sanaparit', Math.max(0, ROUNDS*PER - mistakes), ROUNDS*PER, match);
    const set = pool.slice(round*PER, round*PER+PER); const defs = shuffle(set.map((_,k)=>k));
    const ok = new Set(); let sel = null;
    app.innerHTML = `
      <div class="top"><button class="back" id="x">✕</button><span class="chip">Kierros ${round+1}/${ROUNDS}</span><span class="chip">❌ <span id="mc">${mistakes}</span></span></div>
      <h2>🧩 Sanaparit</h2><p class="sub">Napauta ensin sana, sitten sen selitys.</p>
      <div class="match"><div class="col">${set.map((w,k) => `<button class="mt term" data-t="${k}">${esc(w[0])}</button>`).join('')}</div>
      <div class="col">${defs.map(k => `<button class="mt" data-d="${k}">${esc(set[k][1])}</button>`).join('')}</div></div>
      <div id="fb"></div>`;
    $('#x').onclick = exitGame;
    $$('[data-t]').forEach(b => b.onclick = () => { if (ok.has(+b.dataset.t)) return; $$('[data-t]').forEach(x=>x.classList.remove('sel')); b.classList.add('sel'); sel = +b.dataset.t; });
    $$('[data-d]').forEach(b => b.onclick = () => {
      const d = +b.dataset.d; if (ok.has(d)) return;
      if (sel === null) { shake(b); return; }
      if (d === sel) {
        ok.add(d); beep(true); b.classList.add('ok'); const t = $(`[data-t="${d}"]`); t.classList.remove('sel'); t.classList.add('ok'); sel = null;
        if (ok.size === set.length) { $('#fb').innerHTML = `<div class="fb ok"><b>${pick(PRAISE)}</b> Kaikki parit löytyivät.</div><button class="big" id="nx">${round+1<ROUNDS?'Seuraava kierros ➜':'Katso tulos'}</button>`; $('#nx').onclick = () => { round++; go(next); }; }
      } else { mistakes++; $('#mc').textContent = mistakes; beep(false); shake(b); }
    });
  };
  next();
}

    <button class="big alt" id="rs" style="margin-top:24px">Nollaa tämän kokeen edistyminen</button>

// ================= UUSI KOE KUVISTA (aikuiselle) =================
const pinCode = () => store.get('kp_pin') || '';
let pendingFiles = [];
const TYPE = {mc:'Kysymys', koe:'⭐ Koekysymys', who:'Kuka sanoi?', tf:'Totta vai tarua?'};

function shrink(file){
  return new Promise((res, rej) => {
    const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas');
      c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(u);
      res({media_type:'image/jpeg', data: c.toDataURL('image/jpeg', 0.85).split(',')[1]});
    };
    img.onerror = () => { URL.revokeObjectURL(u); rej(new Error('Kuvaa ei voitu lukea: ' + file.name)); };
    img.src = u;
  });
}

function newPack(msg='', meta={}){
  app.innerHTML = `
    <div class="top"><button class="back" id="x">← Takaisin</button></div>
    <h2>📷 Uusi koe kuvista</h2>
    <p class="small">Kuvaa koealueen sivut järjestyksessä. Tekoäly tekee niistä kertauskysymykset vain kuvien aineiston perusteella. Lue lisää -laatikot menevät bonukseksi. Tarkistat kysymykset ennen kuin ne näkyvät lapselle. Yksi koealue maksaa noin 0,50 €.</p>
    <label class="lbl" for="subj">Aine</label><input class="namebox" id="subj" placeholder="esim. Ympäristöoppi" value="${esc(meta.subject||'')}">
    <label class="lbl" for="ttl">Koealueen nimi (vapaaehtoinen)</label><input class="namebox" id="ttl" placeholder="esim. Vesi ja sen kiertokulku" value="${esc(meta.title||'')}">
    <label class="lbl" for="notes">Lisätiedot (vapaaehtoinen)</label><input class="namebox" id="notes" placeholder="esim. 4. lk, kappaleet 3–6" value="${esc(meta.notes||'')}">
    <label class="lbl">Kuvat (${pendingFiles.length}/40)</label>
    <label class="big alt filebtn">📸 Lisää kuvia<input type="file" id="files" accept="image/*" multiple hidden></label>
    <div class="thumbs" id="th"></div>
    ${pendingFiles.length ? `<button class="big alt" id="clr" style="font-size:15px;padding:10px">Poista kuvat</button>` : ''}
    <label class="lbl" for="pin">Aikuisen PIN-koodi</label><input class="namebox" id="pin" type="password" inputmode="numeric" autocomplete="off" value="${esc(pinCode())}">
    <button class="big" id="go">✨ Tee treenit</button><div class="msg" id="msg">${msg}</div>`;
  const metaNow = () => ({subject: $('#subj').value.trim(), title: $('#ttl').value.trim(), notes: $('#notes').value.trim()});
  pendingFiles.forEach(f => { const im = document.createElement('img'); im.src = URL.createObjectURL(f); $('#th').appendChild(im); });
  $('#x').onclick = () => go(mainHome);
  $('#files').onchange = e => { pendingFiles = pendingFiles.concat(Array.from(e.target.files || [])).slice(0, 40); newPack('', metaNow()); };
  if ($('#clr')) $('#clr').onclick = () => { pendingFiles = []; newPack('', metaNow()); };
  $('#go').onclick = async () => {
    const meta = metaNow(), p = $('#pin').value.trim();
    if (!pendingFiles.length) { $('#msg').textContent = 'Lisää ensin kuvat koealueesta.'; return; }
    if (!p) { $('#msg').textContent = 'Kirjoita PIN-koodi.'; return; }
    store.set('kp_pin', p);
    $('#go').disabled = true; $('#msg').textContent = 'Pienennetään kuvia…';
    try {
      const images = [];
      for (const f of pendingFiles) images.push(await shrink(f));
      generateView(images, meta);
    } catch(e) { $('#go').disabled = false; $('#msg').textContent = '⚠️ ' + e.message; }
  };
}

async function generateView(images, meta){
  screen = 'gen';
  const t0 = Date.now(); let prog = 0, draft = null, err = null;
  app.innerHTML = `<div class="center" style="padding-top:60px"><div class="huge"><span class="pulse">✨</span></div><h2>Tehdään treenejä…</h2>
    <p class="sub" id="st">Lähetetään ${images.length} kuvaa…</p>
    <p class="small">Tämä kestää yleensä 1–3 minuuttia. Pidä sovellus auki ja näyttö päällä.</p></div>`;
  const timer = setInterval(() => { const el = $('#st'); if (el) el.textContent = `Tekoäly lukee kuvia ja kirjoittaa kysymyksiä… ${Math.round((Date.now()-t0)/1000)} s${prog ? ' · ' + prog + ' merkkiä' : ''}`; }, 1000);
  try {
    const r = await fetch(API + '/generate', {method:'POST', headers:{'Content-Type':'application/json','X-PIN': pinCode()}, body: JSON.stringify(Object.assign({}, meta, {images}))});
    if (!r.ok) { const d = await r.json().catch(() => ({})); throw new Error(d.error || ('Virhe ' + r.status)); }
    const reader = r.body.getReader(), dec = new TextDecoder(); let buf = '';
    for (;;) {
      const {value, done} = await reader.read(); if (done) break;
      buf += dec.decode(value, {stream:true}); let i;
      while ((i = buf.indexOf('\n')) >= 0) {
        const line = buf.slice(0, i).trim(); buf = buf.slice(i+1); if (!line) continue;
        const o = JSON.parse(line);
        if (o.progress != null) prog = o.progress;
        if (o.draft) draft = o.draft;
        if (o.error) err = o.error;
      }
    }
  } catch(e) { err = e.message || String(e); }
  clearInterval(timer);
  if (err || !draft) { if (/PIN/.test(err || '')) store.set('kp_pin', ''); return newPack('⚠️ ' + (err || 'Vastaus jäi tyhjäksi. Yritä uudelleen.'), meta); }
  pendingFiles = [];
  store.set('kp_draft', draft);
  go(() => review(draft));
}

function review(d){
  if (!d) return mainHome();
  screen = 'review';
  const save = () => store.set('kp_draft', d);
  const qline = (q, path) => `<div class="rq"><button class="rx" data-del="${path}" aria-label="Poista">✕</button>
    <span class="tag ${q.type==='koe'?'koe':''}">${TYPE[q.type]||q.type}</span>
    <div><b>${q.type==='who' ? '”' + esc(q.text) + '”' : esc(q.text)}</b></div>
    <div class="ok">✓ ${esc(q.answer)}</div>
    ${q.wrong && q.wrong.length ? `<div class="small">✗ ${q.wrong.map(esc).join(' · ')}</div>` : ''}
    ${q.explain ? `<div class="small">💬 ${esc(q.explain)}</div>` : ''}
    <div class="small">📍 ${esc(q.source||'')}</div></div>`;
  const total = d.chapters.reduce((s,c) => s + c.questions.length, 0);
  app.innerHTML = `
    <div class="top"><button class="back" id="x">← Takaisin</button><span class="chip">${total} kysymystä</span></div>
    <h2>Tarkista: ${esc(d.title)}</h2><p class="sub">${esc(d.subtitle)}</p>
    ${d.warnings && d.warnings.length ? `<div class="fb no"><b>Huomioita kuvista:</b><br>${d.warnings.map(esc).join('<br>')}</div>` : ''}
    <p class="small">Poista ✕-napista kysymykset, jotka ovat väärin tai eivät kuulu kokeeseen. Tarkista, että oikeat vastaukset löytyvät kirjasta (📍 kertoo kohdan).</p>
    ${d.chapters.map((c,ci) => `<div class="sec">${esc(c.emoji)} ${c.number ? c.number + '. ' : ''}${esc(c.title)} (${c.questions.length})</div>
      ${c.questions.map((q,qi) => qline(q, `c.${ci}.questions.${qi}`)).join('')}
      ${c.bonus_questions.length ? `<p class="small" style="margin:12px 2px 6px"><b>💡 Bonus (Lue lisää)</b></p>` + c.bonus_questions.map((q,qi) => qline(q, `c.${ci}.bonus_questions.${qi}`)).join('') : ''}`).join('')}
    ${d.timeline.length ? `<div class="sec">📜 Aikajana</div>` + d.timeline.map((t,i) => `<div class="rq"><button class="rx" data-del="t.${i}">✕</button>${i+1}. ${esc(t)}</div>`).join('') : ''}
    ${d.characters.length ? `<div class="sec">🕵️ Hahmot</div>` + d.characters.map((c,i) => `<div class="rq"><button class="rx" data-del="h.${i}">✕</button><b>${esc(c.emoji)} ${esc(c.name)}</b>${c.clues.map(x => `<div class="small">• ${esc(x)}</div>`).join('')}</div>`).join('') : ''}
    ${d.words.length ? `<div class="sec">🧩 Sanaparit</div>` + d.words.map((w,i) => `<div class="rq"><button class="rx" data-del="w.${i}">✕</button><b>${esc(w.term)}</b>${w.bonus ? ' 💡' : ''}<div class="small">${esc(w.definition)}</div></div>`).join('') : ''}
    <button class="big" id="pub">✅ Julkaise lapselle</button>
    <button class="big alt" id="drop" style="color:var(--red)">Hylkää luonnos</button><div class="msg" id="msg"></div>`;
  $('#x').onclick = () => go(mainHome);
  $$('[data-del]').forEach(b => b.onclick = () => {
    const p = b.dataset.del.split('.'), y = window.scrollY;
    if (p[0] === 'c') d.chapters[+p[1]][p[2]].splice(+p[3], 1);
    if (p[0] === 't') d.timeline.splice(+p[1], 1);
    if (p[0] === 'h') d.characters.splice(+p[1], 1);
    if (p[0] === 'w') d.words.splice(+p[1], 1);
    save(); review(d); window.scrollTo(0, y);
  });
  $('#drop').onclick = () => { if (confirm('Hylätäänkö luonnos? Kysymykset katoavat.')) { store.set('kp_draft', null); go(mainHome); } };
  $('#pub').onclick = async () => {
    $('#pub').disabled = true; $('#msg').textContent = 'Julkaistaan…';
    try {
      const r = await fetch(API + '/publish', {method:'POST', headers:{'Content-Type':'application/json','X-PIN': pinCode()}, body: JSON.stringify({draft: d})});
      const res = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(res.error || ('Virhe ' + r.status));
      store.set('kp_draft', null); await syncRemote(); confetti(); go(mainHome);
    } catch(e) { $('#pub').disabled = false; $('#msg').textContent = '⚠️ ' + e.message; }
  };
}

mainHome();
syncRemote();
})();
